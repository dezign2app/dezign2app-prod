name: Build & Release Desktop App

on:
  push:
    branches:
      - main         # Builds automatically as soon as a PR is merged into main
    tags:
      - "v*.*.*"     # Builds & publishes to GitHub Releases on version tags
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
    inputs:
      publish:
        description: "Publish to GitHub Releases?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write    # Grants permission to create and upload to GitHub Releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_flag: --win
          - os: macos-latest
            target_flag: --mac
          - os: ubuntu-latest
            target_flag: --linux

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. Setup pnpm ──────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # ── 3. Setup Node.js ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      # ── 4. Install all workspace dependencies ──────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Build, Stage & Package Desktop App ──────────────────────────
      - name: Build & Package Desktop App
        working-directory: apps/desktop
        run: node scripts/build.js --prod ${{ matrix.target_flag }} ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish == true) && '--publish always' || '--publish never' }}
        env:
          # Automatically provided by GitHub Actions for publishing releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevent macOS build failure if no Apple Developer Certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Production Web Environment Variables
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CONVEX_SITE_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_SITE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          BETTER_AUTH_TRUSTED_ORIGINS: ${{ secrets.BETTER_AUTH_TRUSTED_ORIGINS }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_DESKTOP_AUTH_URL: ${{ secrets.NEXT_PUBLIC_DESKTOP_AUTH_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # ── 6. Upload release artifacts ────────────────────────────────────
      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: ignore
          retention-days: 14
