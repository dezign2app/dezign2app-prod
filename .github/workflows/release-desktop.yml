name: Build & Release Desktop App

on:
  push:
    tags:
      - "v*.*.*"   # Triggers on version tags: v1.0.0, v1.2.3, etc.

permissions:
  contents: write  # Needed to create GitHub Releases

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup pnpm ──────────────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # ── 3. Setup Node ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # ── 4. Install all workspace deps ──────────────────────────────────
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── 5. Build Next.js web app ───────────────────────────────────────
      - name: Build web app
        run: pnpm --filter web build
        env:
          # Pass your secrets as env vars so Next.js build succeeds
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # ── 6. Compile Electron TypeScript ─────────────────────────────────
      - name: Compile Electron main process
        run: pnpm --filter desktop exec tsc -p tsconfig.electron.json

      # ── 7. Package into installer ──────────────────────────────────────
      - name: Package Electron app
        run: pnpm --filter desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Used by electron-builder to upload to GitHub Releases

      # ── 8. Upload artifacts (optional — also accessible in Actions tab) ─
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
          if-no-files-found: ignore
          retention-days: 7
